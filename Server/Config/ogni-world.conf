# Конфигурация worldserver «Огни душ Падших Валькирий» (Windows x64)
# Формат: key = value ; комментарии после ; или #

[ogni.world]
# --- Сеть / сессии ---
BindIP                     = 0.0.0.0
WorldServerPort            = 7777          ; UDP-канал сессий (см. Docs/PROTOCOL.md)
TelemetryPort              = 7778          ; TCP heartbeat/античит
AuthHost                   = 127.0.0.1
AuthPort                   = 3724
MaxPacketsPerSecond        = 800           ; action-heavy трафик экшена
Compression                = 1             ; zstd на потоке движения
SessionCrypto              = x25519-aes-gcm

# --- Экшен-авторитет сервера (де-WOW: клиент не судья ударам) ---
MovementAuthMode           = full          ; VMap+MMap collision + LOS для каждого swing
SwingConeEpsilonDeg        = 8.0           ; допуск угла конуса (клиент-нет-квантизация)
HitLagCompensationMs       = 200           ; rewind позиций для hit-check
VMapEnable                 = 1
MMapEnable                 = 1
PathfindingSIMD            = 1             ; AVX2 Math::Simd

# --- Таймеры мира (под экшен, агрессивнее TC-дефолтов) ---
MapUpdateInterval          = 60            ; мс (TC default 100)
PlayerSaveInterval         = 360           ; сек (TC default 900) — смерть не должна терять прогресс
AOITickInterval            = 100
FallenEventCheckInterval   = 30000         ; мс — watchdog fallen_event.lua
DeathLastChanceSeconds     = 8             ; синхронно с death_mechanic_config

# --- Частицы душ ---
SoulAutocollectRadiusDefault = 3.0
SoulLedgerRetentionDays    = 90
SoulTradeEvaporationPct    = 10

# --- Lua ---
LuaEngine                  = 1
LuaScriptsDir              = ./Lua/scripts
LuaAutoReload              = 0             ; прод: только по команде reload_lua

# --- Кланы / репутация ---
ClanRepKillDecayK          = 0.5           ; коэффициент формулы динамической враждебности
ClanRepWindowHours         = 168           ; скользящее окно пересчёта отношений

# --- БД ---
[ogni.database.world]
hostname = 127.0.0.1
port     = 3306
database = ogni_world
username = ogni
password = CHANGE_ME
poolSize = 16

[ogni.database.auth]
hostname = 127.0.0.1
port     = 3306
database = ogni_auth
username = ogni
password = CHANGE_ME

# --- Логи ---
[ogni.logs]
dir        = ./Logs
level      = 2               ; 0=min ... 4=debug
soulLedger = 1               ; отдельный аудит-лог транзакций душ
